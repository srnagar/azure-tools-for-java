<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Background -->
    <rect width="200" height="200" rx="30" fill="#0078D4" />

    <!-- Text styling with modern font and gradient -->
    <defs>
        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#e6e6e6" />
        </linearGradient>
    </defs>

    <!-- 'azd' text -->
    <text x="100" y="120" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">azd</text>

    <!-- Decorative elements -->
    <path d="M40,40 L160,40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M40,160 L160,160" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />

    <!-- Subtle accent -->
    <circle cx="170" cy="50" r="10" fill="#50E6FF" opacity="0.8" />
</svg>